<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="60" cy="60" r="55" fill="url(#redGradient)" />
  
  <!-- Inner circle border -->
  <circle cx="60" cy="60" r="48" fill="none" stroke="#fecaca" stroke-width="2" />
  
  <!-- JLPT text -->
  <text x="60" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" letter-spacing="2">JLPT</text>
  
  <!-- N2 text -->
  <text x="60" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">N2</text>
</svg>